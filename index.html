    <!-- Google Analytics 4 + Consent Mode v2.

      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {

        ad_user_data: 'denied',

        analytics_storage: 'denied',
        wait_for_update: 500,
      });
      gtag('js', new Date());
      gtag('config', 'G-MG7HBP8EY7', { anonymize_ip: true });
    </script>
    <script async data-cookieconsent="ignore" src="https://www.googletagmanager.com/gtag/js?id=G-MG7HBP8EY7"></script>
