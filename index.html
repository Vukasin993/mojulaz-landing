    <!-- FAQPage structured data for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Za koga je MojUlaz namenjen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MojUlaz je namenjen upravnicima stambenih zgrada, predsednicima skupštine stanara i profesionalnim agencijama za upravljanje nekretninama. Koriste ga i sami stanari za prijavu kvarova, glasanje i pregled obaveštenja."
          }
        },
        {
          "@type": "Question",
          "name": "Kako funkcioniše probni period od 30 dana?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nakon registracije dobijate potpun pristup svim funkcijama bez ikakvih ograničenja. Nema kreditne kartice, nema automatskog naplaćivanja. Nakon 30 dana možete nastaviti sa plaćenom licencom ili odustati — bez ikakvih troškova."
          }
        },
        {
          "@type": "Question",
          "name": "Koliko košta MojUlaz?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MojUlaz košta 2.190 RSD + PDV po zgradi godišnje (2.628 RSD sa PDV-om) za upravnike sa 1–75 zgrada. Sve funkcionalnosti su uključene. Za više od 75 zgrada nudimo posebne uslove — kontaktirajte nas na info@moj-ulaz.com. Probni period od 30 dana je potpuno besplatan."
          }
        },
        {
          "@type": "Question",
          "name": "Da li stanari moraju da instaliraju aplikaciju?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Da. Stanari koriste MojUlaz mobilnu aplikaciju (iOS i Android) za prijavu kvarova, glasanje i pregled obaveštenja. Aplikacija je besplatna i instalacija traje manje od minut. Admin panel je namenjen isključivo upravnicima."
          }
        },
        {
          "@type": "Question",
          "name": "Kako se prijavljuju kvarovi u aplikaciji?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stanar otvori aplikaciju, tapne 'Prijavi kvar', dodá foto i kratak opis — za manje od 30 sekundi. Upravnik odmah dobija notifikaciju, može dodeliti tehničara i ažurirati status. Svi zainteresovani prate napredak u realnom vremenu."
          }
        },
        {
          "@type": "Question",
          "name": "Da li su podaci bezbedni?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sve informacije se čuvaju na serverima u EU, šifrovane su u prenosu i mirovanju (TLS 1.3 + AES-256). Usklađeni smo sa GDPR regulativom i Zakonom o zaštiti podataka o ličnosti Republike Srbije."
          }
        },
        {
          "@type": "Question",
          "name": "Mogu li upravljati više zgrada iz jednog naloga?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Da. Nalog podržava neograničen broj zgrada. Svaka zgrada ima sopstvenu ploču, stanare i istoriju. Agencije i veći upravljači posebno cene pregled svih zgrada na jednom mestu."
          }
        },
        {
          "@type": "Question",
          "name": "Šta ako imam pitanje ili problem tokom korišćenja?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Podrška je dostupna na srpskom jeziku putem emaila i chata, radnim danima od 8 do 18h. Korisnici sa aktivnom licencom imaju prioritetnu podršku sa garantovanim odgovorom u roku od 4 sata."
          }
        }
      ]
